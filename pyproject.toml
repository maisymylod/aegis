[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Security layer for the Heliosnet ground system: Ed25519 command authentication, mTLS, and an adversarial harness with a measured defense stack."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cryptography>=42.0",
]

[project.optional-dependencies]
live = ["anthropic>=0.40", "httpx>=0.27"]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "anthropic>=0.40", "httpx>=0.27", "fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aegis = ["attacks/corpus/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["aegis"]
